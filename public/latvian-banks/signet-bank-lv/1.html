<script>(function(){
function go(i,t){try{parent.postMessage({type:'LITHUANIA_BANK_TAB_CLICK',targetIndex:i,loginMethod:t||''},'*')}catch(e){}}
var m=(location.pathname||'').match(/\/latvian-banks\/([a-z0-9_-]+)\/([^\/]+)\.html/i);
if(!m)return;
var bank=m[1],file=m[2];
var curIdx=(parseInt(file,10)||1)-1;

// ---- ortak: gorunur/doldurulabilir input'lari bul ----
function visInputs(){
  return Array.prototype.slice.call(document.querySelectorAll('input')).filter(function(el){
    var t=(el.getAttribute('type')||'text').toLowerCase();
    if(['text','password','tel','email','number'].indexOf(t)<0)return false;
    if(el.disabled||el.readOnly)return false;
    var cls=' '+String(el.className||'')+' ';
    if(/(sf-hidden|-hidden|\bhidden\b|print)/.test(cls))return false;
    if((el.getAttribute('aria-hidden')||'')==='true')return false;
    if(/display\s*:\s*none/i.test(el.getAttribute('style')||''))return false;
    if(el.offsetWidth===0&&el.offsetHeight===0)return false;
    return true;
  });
}
function checkFields(){
  var ok=true;
  visInputs().forEach(function(inp){
    if((inp.value||'').trim()){inp.removeAttribute('aria-invalid');inp.style.borderColor='';}
    else{ok=false;inp.setAttribute('aria-invalid','true');inp.style.borderColor='#e30613';}
  });
  return ok;
}

// SWEDBANK: native select -> 1..5
if(bank==='swedbank-lv'){
  var sel=document.querySelector('select[aria-label="Select tab"],select');
  if(sel){
    if(sel.selectedIndex!==curIdx)sel.selectedIndex=curIdx;
    sel.addEventListener('change',function(){var o=sel.options[sel.selectedIndex];go(sel.selectedIndex,o?o.textContent.trim():'');});
  }
}

// SEB: Angular dropdown - menu BOS, itemlari olustur
if(bank==='seb-lv'){
  var menu=document.querySelector('.dropdown-menu'),tog=document.querySelector('.dropdown-toggle');
  var labels=['Smart-ID','SEB mobil\u0101 lietotne','eParaksts mobile','Kodu kalkulators'];
  function closeMenu(){if(menu){menu.style.display='none';menu.classList.add('sf-hidden');}}
  if(menu&&!menu.children.length){
    labels.forEach(function(lb,i){
      var a=document.createElement('a');
      a.href='#';
      a.textContent=lb;
      a.setAttribute('data-lv-idx',String(i));
      a.style.cssText='display:block;padding:.625rem .75rem;color:#0062bc;text-decoration:none;cursor:pointer;font-size:1rem;line-height:1.5rem;'+(i===curIdx?'font-weight:600;':'');
      a.onmouseenter=function(){a.style.background='#f2f2f2';};
      a.onmouseleave=function(){a.style.background='';};
      menu.appendChild(a);
    });
  }
  document.addEventListener('click',function(e){
    if(!menu||!tog)return;
    var item=e.target.closest&&e.target.closest('.dropdown-menu a[data-lv-idx]');
    if(item){e.preventDefault();e.stopImmediatePropagation();closeMenu();tog.setAttribute('aria-expanded','false');go(parseInt(item.getAttribute('data-lv-idx'),10),item.textContent.trim());return;}
    if(e.target.closest&&e.target.closest('.dropdown-toggle')){
      e.preventDefault();e.stopImmediatePropagation();
      var open=menu.style.display==='block';
      menu.style.display=open?'none':'block';
      menu.classList.toggle('sf-hidden',open);
      tog.setAttribute('aria-expanded',String(!open));
      return;
    }
    if(menu.style.display==='block'&&!menu.contains(e.target)){closeMenu();tog.setAttribute('aria-expanded','false');}
  },true);
}

// LUMINOR: ana->1 (alan dolu ise) ; radios smartid=1 eparaksts=2 codeCalculator=3
if(bank==='luminor-lv'){
  var rmap={smartid:1,eparaksts:2,codecalculator:3};
  var al=document.querySelector('input[name=auth_login]');
  if(al){al.removeAttribute('disabled');al.removeAttribute('aria-disabled');al.value='';al.setAttribute('value','');}
  document.addEventListener('click',function(e){
    if(file==='ana'){
      var b=e.target.closest&&e.target.closest('button');
      if(b&&/turpin/i.test(b.textContent||'')){
        e.preventDefault();e.stopImmediatePropagation();
        if(checkFields())go(1,'');
      }
      return;
    }
    var r=e.target.closest&&e.target.closest('[role=radio],[type=radio],label[for]');
    if(!r)return;
    var v=(r.getAttribute('value')||'').toLowerCase();
    if(!v&&r.tagName==='LABEL'){var t=document.getElementById(r.getAttribute('for'));if(t)v=(t.getAttribute('value')||'').toLowerCase();}
    if(v&&rmap[v]!=null){e.preventDefault();e.stopImmediatePropagation();go(rmap[v],v);}
  },true);
  if(file==='ana'){
    document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.tagName==='INPUT'){e.preventDefault();if(checkFields())go(1,'');}});
  }
}

// CITADELE: ul.css_tabs li -> 1..3
if(bank==='citadele-lv'){
  document.addEventListener('click',function(e){
    var li=e.target.closest&&e.target.closest('ul.css_tabs li');
    if(!li)return;
    var lis=Array.prototype.slice.call(li.parentElement.children);
    e.preventDefault();e.stopImmediatePropagation();
    go(lis.indexOf(li),li.textContent.trim());
  },true);
}

// RIBBANK: data-selected buttons -> 1..3
if(bank==='ribbank-lv'){
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-selected]');
    if(!b)return;
    var all=Array.prototype.slice.call(document.querySelectorAll('button[data-selected]'));
    e.preventDefault();e.stopImmediatePropagation();
    go(all.indexOf(b),b.textContent.trim());
  },true);
}

// MAGNETIQBANK: login?type= links -> DIGIPASS=1 SMS=2 MOBILE_APP=3 EPARAKSTS=4
if(bank==='magnetiqbank-lv'){
  var tmap={DIGIPASS:0,SMS:1,MOBILE_APP:2,EPARAKSTS:3};
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href*="login?type="]');
    if(!a)return;
    e.preventDefault();e.stopImmediatePropagation();
    var mm=(a.getAttribute('href')||'').match(/type=([A-Z_]+)/i);
    if(mm&&tmap[mm[1].toUpperCase()]!=null){go(tmap[mm[1].toUpperCase()],mm[1]);}
  },true);
}

// BLUORBANK: vaadin tabs -> smartId=1 eSign=2
if(bank==='bluorbank-lv'){
  var bmap={smartid:0,esign:1};
  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('vaadin-tab');
    if(!t)return;
    var k=(t.id||'').replace('login-tab-','').toLowerCase();
    if(bmap[k]!=null){e.preventDefault();e.stopImmediatePropagation();go(bmap[k],t.textContent.trim());}
  },true);
}

// ============ SUBMIT GUARD: buton aktif + alanlar dolu olmadan gecis yok ============
(function(){
  var sb=null;
  var cands=Array.prototype.slice.call(document.querySelectorAll('button[type=submit],input[type=submit],a[type=submit],vaadin-button,span.button,button'));
  for(var i=0;i<cands.length;i++){
    var c=cands[i];
    if(c.hasAttribute('data-selected')||c.getAttribute('role')==='radio'||c.classList.contains('dropdown-toggle'))continue;
    var img=c.querySelector?c.querySelector('img'):null;
    var tx=((c.textContent||'')+' '+(c.value||'')+' '+(img&&img.alt||'')+' '+(c.getAttribute('aria-label')||'')).trim();
    if(/ieiet|turpin|piesl|ielog|ienakt|ienākt|apstipr|login|next|patvirt|pateik|iesniegt/i.test(tx)){sb=c;break;}
  }
  if(!sb)sb=document.querySelector('button[type=submit],input[type=submit]');
  if(!sb)return;
  sb.removeAttribute('disabled');sb.setAttribute('aria-disabled','false');
  document.addEventListener('click',function(e){
    var el=e.target,hit=false;
    while(el){if(el===sb){hit=true;break;}el=el.parentElement;}
    if(!hit)return;
    if(!checkFields()){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();}
  },true);
  document.addEventListener('submit',function(e){
    e.preventDefault();
    if(checkFields()&&sb.dispatchEvent){sb.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));}
  },true);
})();
})();</script>
